---
- name: Universal Interactive Turn-Key Linux Pre-Hardening Framework (Stage 1)
  hosts: localhost
  become: true
  gather_facts: true

  # =========================================================================
  # INTERACTIVE SECURE TERMINAL PROMPTS (DYNAMIC CONSTRAINTS ENGINE)
  # =========================================================================
  vars_prompt:
    - name: vault_size_input
      prompt: "Enter the size for the independent Vault partition in GB (Must be between 10 and 30)"
      default: "10"
      private: false

    - name: vault_os_root_passphrase
      prompt: "Enter Master Passphrase for Main OS Partition (Typed at boot)"
      private: true

    - name: vault_secure_vault_passphrase
      prompt: "Enter Master Passphrase for Secure Vault Partition (Backup Text Password)"
      private: true

    - name: vault_root_password
      prompt: "Enter System Administrative ROOT Password"
      private: true

    - name: target_username
      prompt: "Enter the account username for the primary regular user"
      default: "vega"
      private: false

    - name: vault_user_password
      prompt: "Enter the account password for the regular user"
      private: true
  vars:
    os_crypt_name: "crypt_root"
    vault_crypt_name: "secure_vault"
    os_passphrase: "{{ vault_os_root_passphrase }}"
    vault_passphrase: "{{ vault_secure_vault_passphrase }}"
    perf_mount_opts: "noatime,space_cache=v2,compress=zstd:1"
    swap_mount_opts: "noatime,space_cache=v2,nodatacow"

  pre_tasks:
    - name: Validate that user input falls strictly within the 10GB to 30GB maximum bounds
      ansible.builtin.assert:
        that:
          - vault_size_input | int >= 10
          - vault_size_input | int <= 30
        msg: "FATAL ERROR: Vault allocation size must be specified between 10 and 30 GB max."

    - name: Dynamically identify the primary physical disk block device path
      ansible.builtin.set_fact:
        target_disk: "/dev/{{ ansible_facts['devices'].keys() | select('match', '^(sda|vda|nvme[0-9]n[0-9]|sdm|vd[a-z]|xvd[a-z])$') | first }}"
      failed_when: target_disk is not defined

    - name: Detect active host target firmware configuration mode (BIOS vs UEFI)
      ansible.builtin.stat:
        path: /sys/firmware/efi
      register: efi_check

    - name: Establish global firmware status variable maps and dynamic storage math slices
      ansible.builtin.set_fact:
        is_uefi: "{{ efi_check.stat.exists }}"
        p_suffix: "{{ 'p' if 'nvme' in target_disk else '' }}"
        vault_slice_start: "-{{ vault_size_input }}GiB"

    # =========================================================================
    # TRIPLE-CHECKED THREE-TIER HYBRID SWAP RATIO CALCULATION ENGINE
    # =========================================================================
    - name: Calculate variable swap file sizing threshold footprint bounds from memory capacity facts
      ansible.builtin.set_fact:
        stage1_swap_mb: >-
          {{
            (ansible_facts['memtotal_mb'] | int * 2.0) | int
            if (ansible_facts['memtotal_mb'] | int <= 4096)
            else (ansible_facts['memtotal_mb'] | int * 1.5) | int
            if (ansible_facts['memtotal_mb'] | int > 4096 and ansible_facts['memtotal_mb'] | int < 8192)
            else 4096
          }}

    - name: Ingest multi-distribution security baseline mappings file
      ansible.builtin.include_vars:
        file: vars_mapping.yml
        name: distro_blueprint

    # =========================================================================
    # PLATFORM EXTENDED VARIABLE MATCHING MATRIX (PREVENTS LOOKUP ATTRIBUTE ERRORS)
    # =========================================================================
    - name: Map host platform operational security variables for Arch Linux
      ansible.builtin.set_fact:
        core_packages: "{{ distro_blueprint.arch_vars.core_packages }}"
        arpwatch_user: "{{ distro_blueprint.arch_vars.arpwatch_user }}"
        zram_conf_path: "{{ distro_blueprint.arch_vars.zram_conf_path }}"
        audit_rules_path: "{{ distro_blueprint.arch_vars.audit_rules_path }}"
        aide_db_path: "{{ distro_blueprint.arch_vars.aide_db_path }}"
        clamav_service: "{{ distro_blueprint.arch_vars.clamav_service }}"
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: Map host platform operational security variables for Debian
      ansible.builtin.set_fact:
        core_packages: "{{ distro_blueprint.debian_vars.core_packages }}"
        arpwatch_user: "{{ distro_blueprint.debian_vars.arpwatch_user }}"
        zram_conf_path: "{{ distro_blueprint.debian_vars.zram_conf_path }}"
        audit_rules_path: "{{ distro_blueprint.debian_vars.audit_rules_path }}"
        aide_db_path: "{{ distro_blueprint.debian_vars.aide_db_path }}"
        clamav_service: "{{ distro_blueprint.debian_vars.clamav_service }}"
      when: ansible_facts['os_family'] == 'Debian'

    - name: Map host platform operational security variables for Fedora (RedHat)
      ansible.builtin.set_fact:
        core_packages: "{{ distro_blueprint.fedora_vars.core_packages }}"
        arpwatch_user: "{{ distro_blueprint.fedora_vars.arpwatch_user }}"
        zram_conf_path: "{{ distro_blueprint.fedora_vars.zram_conf_path }}"
        audit_rules_path: "{{ distro_blueprint.fedora_vars.audit_rules_path }}"
        aide_db_path: "{{ distro_blueprint.fedora_vars.aide_db_path }}"
        clamav_service: "{{ distro_blueprint.fedora_vars.clamav_service }}"
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Map host platform operational security variables for openSUSE (Suse)
      ansible.builtin.set_fact:
        core_packages: "{{ distro_blueprint.suse_vars.core_packages }}"
        arpwatch_user: "{{ distro_blueprint.suse_vars.arpwatch_user }}"
        zram_conf_path: "{{ distro_blueprint.suse_vars.zram_conf_path }}"
        audit_rules_path: "{{ distro_blueprint.suse_vars.audit_rules_path }}"
        aide_db_path: "{{ distro_blueprint.suse_vars.aide_db_path }}"
        clamav_service: "{{ distro_blueprint.suse_vars.clamav_service }}"
      when: ansible_facts['os_family'] == 'Suse'
  tasks:
    - name: Output discovered turn-key hardware topology to execution logs
      ansible.builtin.debug:
        msg: 
          - "Target Block Device Identified: {{ target_disk }}"
          - "System Boot Mode Configuration: {{ 'UEFI Execution Framework' if is_uefi else 'Legacy BIOS Engine' }}"
          - "Dynamic Vault Size Target Allocated (sda2): {{ vault_size_input }} GB"

    - name: Write a modern clean GPT partition layout ledger to the target drive
      community.general.parted:
        device: "{{ target_disk }}"
        label: gpt
        number: 1
        state: present

    # =========================================================================
    # INTENDED TWO-PARTITION DYNAMIC BOUNDARY MATRIX (sda1=MAIN OS, sda2=VAULT)
    # =========================================================================
    - name: Provision primary slice for Main OS and Boot arrays (sda1)
      community.general.parted:
        device: "{{ target_disk }}"
        number: 1
        part_start: "1MiB"
        part_end: "{{ vault_slice_start }}"
        flags: "{{ ['boot', 'esp'] if is_uefi else ['bios_grub'] }}"
        state: present

    - name: Provision requested size boundary slice for independent Vault allocations (sda2)
      community.general.parted:
        device: "{{ target_disk }}"
        number: 2
        part_start: "{{ vault_slice_start }}"
        part_end: "100%"
        state: present

    # =========================================================================
    # CRYPTOGRAPHIC STRUCTURE & SYSTEM FILE POOL INITIALIZATION
    # =========================================================================
    - name: Initialize high-security LUKS1 encryption wrapper on sda1 for GRUB compatibility
      ansible.builtin.shell: |
        echo -n "$OS_PASS" | cryptsetup luksFormat --type luks1 --batch-mode {{ target_disk }}{{ p_suffix }}1 -
      environment:
        OS_PASS: "{{ os_passphrase }}"
      when: not ansible_check_mode
      no_log: true

    - name: Unlock and expose main root operating system encrypted channel pathway
      ansible.builtin.shell: |
        echo -n "$OS_PASS" | cryptsetup open {{ target_disk }}{{ p_suffix }}1 {{ os_crypt_name }} -
      environment:
        OS_PASS: "{{ os_passphrase }}"
      when: not ansible_check_mode
      no_log: true

    - name: Format the primary root operating volume container as a Btrfs pool array
      ansible.builtin.command: mkfs.btrfs -f /dev/mapper/{{ os_crypt_name }}
      when: not ansible_check_mode

    - name: Build temporary workspace target mounting pathways
      ansible.builtin.file:
        path: /mnt/btrfs_root
        state: directory
        mode: '0755'

    - name: Temporarily mount raw Btrfs root array layout to slice out system layers
      ansible.posix.mount:
        path: /mnt/btrfs_root
        src: "/dev/mapper/{{ os_crypt_name }}"
        fstype: btrfs
        state: mounted
      when: not ansible_check_mode

    - name: Programmatically slice out all core requested OS subvolume layers
      ansible.builtin.command: "btrfs subvolume create /mnt/btrfs_root/{{ item }}"
      loop: [ '@', '@home', '@snapshots', '@log', '@cache', '@libvirt', '@docker', '@swap' ]
      when: not ansible_check_mode

    - name: Safely unmount temporary baseline array allocation pathway
      ansible.posix.mount:
        path: /mnt/btrfs_root
        state: unmounted
      when: not ansible_check_mode

    - name: Clean up temporary structural allocation directories
      ansible.builtin.file:
        path: /mnt/btrfs_root
        state: absent
    # =========================================================================
    # TARGET WORKSPACE ASSEMBLY & STRUCTURAL SUBVOLUME MOUNT TREES
    # =========================================================================
    - name: Mount optimized execution target System Root subvolume path (@)
      ansible.posix.mount:
        path: /mnt/target
        src: "/dev/mapper/{{ os_crypt_name }}"
        fstype: btrfs
        opts: "subvol=@,{{ perf_mount_opts }}"
        state: mounted
      when: not ansible_check_mode

    - name: Instantiate internal structural nested deployment system directories
      ansible.builtin.file:
        path: "/mnt/target/{{ item }}"
        state: directory
        mode: '0755'
      loop: [ 'home', '.snapshots', 'secure', 'swapfile_mount', 'boot', 'boot/efi', 'var', 'var/log', 'var/cache', 'var/lib', 'var/lib/libvirt', 'var/lib/docker' ]
      when: not ansible_check_mode

    - name: Systematically mount stratified target subvolumes into directory trees
      ansible.posix.mount:
        path: "/mnt/target/{{ item.path }}"
        src: "/dev/mapper/{{ os_crypt_name }}"
        fstype: btrfs
        opts: "subvol={{ item.subvol }},{{ perf_mount_opts }}"
        state: mounted
      loop:
        - { path: "home", subvol: "@home" }
        - { path: ".snapshots", subvol: "@snapshots" }
        - { path: "var/cache", subvol: "@cache" }
        - { path: "var/log", subvol: "@log" }
        - { path: "var/lib/libvirt", subvol: "@libvirt" }
        - { path: "var/lib/docker", subvol: "@docker" }
      when: not ansible_check_mode

    - name: Mount specialized uncompressed storage block layer for swap allocations
      ansible.posix.mount:
        path: /mnt/target/swapfile_mount
        src: "/dev/mapper/{{ os_crypt_name }}"
        fstype: btrfs
        opts: "subvol=@swap,{{ swap_mount_opts }}"
        state: mounted
      when: not ansible_check_mode

    - name: Create empty placeholder inside the uncompressed swap subvolume zone
      ansible.builtin.file:
        path: /mnt/target/swapfile_mount/swapfile
        state: touch
        owner: root
        group: root
        mode: '0600'
      when: not ansible_check_mode

    - name: Disable Copy-on-Write (CoW) metrics on the raw 0-byte file structure
      ansible.builtin.command: chattr +C /mnt/target/swapfile_mount/swapfile
      when: not ansible_check_mode

    - name: Pre-allocate target space blocks for Option B ratio swap execution limits
      ansible.builtin.command: "dd if=/dev/zero of=/mnt/target/swapfile_mount/swapfile bs=1M count={{ stage1_swap_mb }}"
      when: not ansible_check_mode

    - name: Format the uncompressed target block structure as an operational swap space
      ansible.builtin.command: mkswap /mnt/target/swapfile_mount/swapfile
      when: not ansible_check_mode

    - name: Link root filesystem paths directly to the isolated swap subvolume container
      ansible.builtin.file:
        src: /swapfile_mount/swapfile
        dest: /mnt/target/swapfile
        state: link
        force: true
      when: not ansible_check_mode

    - name: Bind mount target EFI partition block directly if host booted via UEFI
      ansible.posix.mount:
        path: /mnt/target/boot/efi
        src: "{{ target_disk }}{{ p_suffix }}1"
        fstype: vfat
        opts: "defaults"
        state: mounted
      when: 
        - is_uefi
        - not ansible_check_mode
    - name: Execute Core Operating System Image Provisioning (Arch Linux Module)
      ansible.builtin.command: pacstrap -K /mnt/target base base-devel linux linux-lts linux-hardened linux-firmware btrfs-progs cryptsetup
      when: 
        - ansible_facts['os_family'] == 'Archlinux'
        - not ansible_check_mode

    - name: Execute Core Operating System Image Provisioning (Debian Module)
      block:
        - name: Deploy Debootstrap utility onto host runner context
          ansible.builtin.package:
            name: debootstrap
            state: present
        - name: Pull clean core image layers onto targeted root structure
          ansible.builtin.command: debootstrap stable /mnt/target http://debian.org
      when: 
        - ansible_facts['os_family'] == 'Debian'
        - not ansible_check_mode

    - name: Execute Core Operating System Image Provisioning (Fedora Module)
      ansible.builtin.command: "dnf --installroot=/mnt/target --releasever=40 groupinstall -y core"
      when: 
        - ansible_facts['os_family'] == 'RedHat'
        - not ansible_check_mode

    - name: Execute Core Operating System Image Provisioning (openSUSE Module)
      ansible.builtin.command: "zypper --root /mnt/target install -y patterns-openfilesystems-base core"
      when: 
        - ansible_facts['os_family'] == 'Suse'
        - not ansible_check_mode

    # =========================================================================
    # INTERACTIVE VAULT INITIALIZATION & AUTOMATED KEYFILE SLOTS (sda2)
    # =========================================================================
    - name: Initialize modern LUKS2 container wrapper using the typed Vault backup passphrase
      ansible.builtin.shell: |
        echo -n "$VAULT_PASS" | cryptsetup luksFormat --type luks2 --pbkdf argon2id --batch-mode {{ target_disk }}{{ p_suffix }}2 -
      environment:
        VAULT_PASS: "{{ vault_passphrase }}"
      no_log: true
      when: not ansible_check_mode

    - name: Ensure parent local directory path exists inside target root
      ansible.builtin.file:
        path: /mnt/target/etc/secure
        state: directory
        owner: root
        group: root
        mode: '0700'
      when: not ansible_check_mode

    - name: Generate random 32-byte physical security keyfile inside root mount
      ansible.builtin.command: dd if=/dev/urandom of=/mnt/target/etc/secure/vault.key bs=1 count=32
      when: not ansible_check_mode

    - name: Restrict file read access signatures strictly to system root account
      ansible.builtin.file:
        path: /mnt/target/etc/secure/vault.key
        owner: root
        group: root
        mode: '0400'
      when: not ansible_check_mode

    - name: Inject the generated system keyfile into secondary slot of vault partition sda2
      ansible.builtin.shell: |
        echo -ne "$VAULT_PASS" | cryptsetup luksAddKey --batch-mode {{ target_disk }}{{ p_suffix }}2 /mnt/target/etc/secure/vault.key -
      environment:
        VAULT_PASS: "{{ vault_passphrase }}"
      no_log: true
      when: not ansible_check_mode

    - name: Unlock vault mapper channel utilizing the newly registered system keyfile
      ansible.builtin.command: >
        cryptsetup open {{ target_disk }}{{ p_suffix }}2 {{ vault_crypt_name }} --key-file /mnt/target/etc/secure/vault.key
      when: not ansible_check_mode

    - name: Extract the target hardware UUID parameter block from vault partition sda2
      ansible.builtin.command: blkid -s UUID -o value {{ target_disk }}{{ p_suffix }}2
      register: vault_uuid_raw
      when: not ansible_check_mode

    - name: Format the exposed vault target mapped space as standard Ext4 storage
      ansible.builtin.filesystem:
        fstype: ext4
        dev: "/dev/mapper/{{ vault_crypt_name }}"
      when: not ansible_check_mode

    - name: Instantly lock the vault container to secure files descriptors from RAM
      ansible.builtin.command: "cryptsetup close {{ vault_crypt_name }}"
      when: not ansible_check_mode
    # =========================================================================
    # SYSTEM CONFIGURATION MAPPINGS & CHROOT INTERFACES
    # =========================================================================
    - name: Bind essential virtual API kernel filesystems into the target node workspace
      ansible.builtin.command: "mount --bind {{ item.src }} /mnt/target{{ item.path }}"
      loop:
        - { src: "/dev", path: "/dev" }
        - { src: "/dev/pts", path: "/dev/pts" }
        - { src: "/proc", path: "/proc" }
        - { src: "/sys", path: "/sys" }
      when: not ansible_check_mode

    - name: Copy host DNS configuration to prevent chroot network mirror failures
      ansible.builtin.copy:
        src: /etc/resolv.conf
        dest: /mnt/target/etc/resolv.conf
        owner: root
        group: root
        mode: '0644'
      when: not ansible_check_mode

    - name: Dynamically generate static file system configuration mapping table ledger
      ansible.builtin.copy:
        content: |
          # /etc/fstab: Static file system information.
          /dev/mapper/{{ os_crypt_name }}   /               btrfs   subvol=@,{{ perf_mount_opts }} 0 0
          /dev/mapper/{{ os_crypt_name }}   /home           btrfs   subvol=@home,{{ perf_mount_opts }} 0 0
          /dev/mapper/{{ os_crypt_name }}   /.snapshots     btrfs   subvol=@snapshots,{{ perf_mount_opts }} 0 0
          /dev/mapper/{{ os_crypt_name }}   /var/log        btrfs   subvol=@log,{{ perf_mount_opts }} 0 0
          /dev/mapper/{{ os_crypt_name }}   /var/cache      btrfs   subvol=@cache,{{ perf_mount_opts }} 0 0
          /dev/mapper/{{ os_crypt_name }}   /var/lib/libvirt/images btrfs subvol=@libvirt,{{ perf_mount_opts }} 0 0
          /dev/mapper/{{ os_crypt_name }}   /var/lib/docker btrfs   subvol=@docker,{{ perf_mount_opts }} 0 0
          /dev/mapper/{{ os_crypt_name }}   /swapfile_mount btrfs   subvol=@swap,{{ swap_mount_opts }} 0 0
          /swapfile_mount/swapfile          none            swap    sw,pri=10 0 0
          {% if is_uefi %}/dev/mapper/{{ os_crypt_name }}               /boot/efi       btrfs   subvol=@ 0 0{% endif %}
        dest: /mnt/target/etc/fstab
        owner: root
        group: root
        mode: '0644'
      when: not ansible_check_mode

    - name: Configure the crypttab block engine map to automatically pass the keyfile at boot
      ansible.builtin.copy:
        content: |
          # <target name> <source device> <key file> <options>
          {{ os_crypt_name }} {{ target_disk }}{{ p_suffix }}1 none luks,discard
          {{ vault_crypt_name }} UUID={{ vault_uuid_raw.stdout | default('CHECK_MODE_UUID_STUB') }} /etc/secure/vault.key luks,discard
        dest: /mnt/target/etc/crypttab
        owner: root
        group: root
        mode: '0644'
      when: not ansible_check_mode

    # =========================================================================
    # SYSTEM UTILITY BINARY WRAPPER DEPLOYMENT (vault open / close)
    # =========================================================================
    - name: Deploy custom encrypted storage layout administration wrapper binary to system paths
      ansible.builtin.copy:
        dest: /mnt/target/usr/local/bin/vault
        content: |
          #!/usr/bin/env bash
          # /usr/local/bin/vault - Hardened Secure Vault Automation Wrapper
          set -euo pipefail
          
          VAULT_UUID="{{ vault_uuid_raw.stdout | default('CHECK_MODE_UUID_STUB') }}"
          MAPPER_NAME="{{ vault_crypt_name }}"
          MOUNT_POINT="/vault"
          KEY_FILE="/etc/secure/vault.key"
          
          if [[ $EUID -ne 0 ]]; then
             echo "[-] Error: This operation requires administrative privileges." >&2
             echo "    Please run using: sudo vault open  OR  sudo vault close" >&2
             exit 1
          fi
          
          open_vault() {
              if [[ -b "/dev/mapper/${MAPPER_NAME}" ]]; then
                  echo "[!] Notification: Cryptographic mapper '${MAPPER_NAME}' is already active."
              else
                  echo "[+] Unlocking secure vault layer via hardware UUID..."
                  cryptsetup open "UUID=${VAULT_UUID}" "${MAPPER_NAME}" --key-file "${KEY_FILE}"
              fi
          
              if mountpoint -q "${MOUNT_POINT}"; then
                  echo "[✔] Done: Vault is already mounted safely at ${MOUNT_POINT}."
              else
                  echo "[+] Mounting storage layer..."
                  mkdir -p "${MOUNT_POINT}"
                  mount -v "/dev/mapper/${MAPPER_NAME}" "${MOUNT_POINT}"
                  echo "[✔] Success: Vault successfully mounted at ${MOUNT_POINT}"
              fi
          }
          
          close_vault() {
              echo "[-] Initiating teardown protocols..."
              
              if mountpoint -q "${MOUNT_POINT}"; then
                  echo "[+] Clearing filesystem file descriptor locks..."
                  fuser -km "${MOUNT_POINT}" || true
                  sleep 0.5
                  
                  echo "[+] Forcefully tearing down all mount layers..."
                  umount -R -v "${MOUNT_POINT}"
                  echo "[✔] Filesystem safely unmounted."
              fi
          
              if [[ -b "/dev/mapper/${MAPPER_NAME}" ]]; then
                  cryptsetup luksClose "${MAPPER_NAME}"
                  echo "[✔] Vault closed. Decryption keys completely flushed from RAM."
              else
                  echo "[!] Notification: Cryptographic mapper was already closed."
              fi
          }
          
          case "${1:-}" in
              open)
                  open_vault
                  ;;
              close)
                  close_vault
                  ;;
              *)
                  echo "Usage: vault {open|close}" >&2
                  exit 2
                  ;;
          esac
        owner: root
        group: root
        mode: '0755'
      when: not ansible_check_mode

    - name: Define chroot utility invocation macro strings based on platform distribution
      ansible.builtin.set_fact:
        chroot_cmd: "{{ 'arch-chroot /mnt/target' if ansible_facts['os_family'] == 'Archlinux' else 'chroot /mnt/target' }}"

    - name: Download firmware-dependent runtime boot loader modules inside chroot context
      ansible.builtin.command: >
        {{ chroot_cmd }} {{
          'pacman -S --noconfirm grub networkmanager efibootmgr' if ansible_facts['os_family'] == 'Archlinux' else
          'apt-get update && apt-get install -y linux-image-amd64 cryptsetup-initramfs grub-pc sudo' if (ansible_facts['os_family'] == 'Debian' and not is_uefi) else
          'apt-get update && apt-get install -y linux-image-amd64 cryptsetup-initramfs grub-efi-amd64 efibootmgr sudo' if (ansible_facts['os_family'] == 'Debian' and is_uefi) else
          'dnf install -y grub2-efi efibootmgr networkmanager sudo' if (ansible_facts['os_family'] == 'RedHat') else 
          'zypper install -y grub2-x86_64-efi efibootmgr NetworkManager sudo'
        }}
      when: not ansible_check_mode

    - name: Set administrative user security identities and system privilege escalation
      ansible.builtin.shell: |
        echo "root:{{ vault_root_password }}" | {{ chroot_cmd }} chpasswd
        {{ chroot_cmd }} groupadd -g 1000 {{ target_username }} || true
        {{ chroot_cmd }} useradd -u 1000 -g 1000 -m -s /bin/bash {{ target_username }} || true
        echo "{{ target_username }}:{{ vault_user_password }}" | {{ chroot_cmd }} chpasswd
        echo "{{ target_username }} ALL=(ALL:ALL) ALL" > /mnt/target/etc/sudoers.d/{{ target_username }}
        chmod 0440 /mnt/target/etc/sudoers.d/{{ target_username }}
      no_log: true
      when: not ansible_check_mode
    - name: Inject critical crypto modules and hooks into mkinitcpio configuration (Arch Linux)
      ansible.builtin.lineinfile:
        path: /mnt/target/etc/mkinitcpio.conf
        regexp: '^HOOKS='
        line: 'HOOKS=(base udev autodetect modconf kms keyboard keymap consolefont block encrypt btrfs filesystems fsck)'
      when: 
        - ansible_facts['os_family'] == 'Archlinux'
        - not ansible_check_mode

    - name: Compile hardened initramfs boot images inside targeted runtime environment (Arch Linux)
      ansible.builtin.command: arch-chroot /mnt/target mkinitcpio -P
      when: 
        - ansible_facts['os_family'] == 'Archlinux'
        - not ansible_check_mode

    - name: Inject critical encryption parameters into core GRUB configurations
      ansible.builtin.lineinfile:
        path: /mnt/target/etc/default/grub
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: '^#?GRUB_ENABLE_CRYPTODISK=', line: 'GRUB_ENABLE_CRYPTODISK=y' }
        - { regexp: '^GRUB_CMDLINE_LINUX=', line: 'GRUB_CMDLINE_LINUX="cryptdevice={{ target_disk }}{{ p_suffix }}1:{{ os_crypt_name }} root=/dev/mapper/{{ os_crypt_name }}"' }
      when: not ansible_check_mode

    - name: Deploy physical GRUB engine mapping blocks based on firmware mode
      ansible.builtin.command: "{{ chroot_cmd }} {{ 'grub-install --target=x86_64-efi --efi-directory=/boot --bootloader-id=GRUB --recheck' if is_uefi else 'grub-install ' + target_disk }}"
      when: not ansible_check_mode

    - name: Compile final GRUB environment execution maps
      ansible.builtin.command: "{{ chroot_cmd }} {{ 'grub-mkconfig -o /boot/grub/grub.cfg' if (ansible_facts['os_family'] == 'Archlinux' or ansible_facts['os_family'] == 'RedHat') else 'update-grub' }}"
      when: not ansible_check_mode

    - name: Regenerate initramfs boot images with structural encryption hooks (Debian)
      ansible.builtin.command: chroot /mnt/target update-initramfs -u -k all
      when: 
        - ansible_facts['os_family'] == 'Debian'
        - not ansible_check_mode

    # =========================================================================
    # PHASE 6: SAFE TEARDOWN PIPELINE
    # =========================================================================
    - name: Unmount virtual API kernel filesystems to unlock the target structure workspace
      ansible.builtin.command: "umount -l /mnt/target{{ item }}"
      loop: [ '/dev/pts', '/dev', '/proc', '/sys' ]
      when: not ansible_check_mode

    - name: Run a clean unmount tear down to clear RAM storage caches safely
      ansible.posix.mount:
        path: "{{ item }}"
        state: unmounted
      loop:
        - /mnt/target/boot/efi
        - /mnt/target/var/lib/docker
        - /mnt/target/var/lib/libvirt
        - /mnt/target/var/log
        - /mnt/target/var/cache
        - /mnt/target/.snapshots
        - /mnt/target/home
        - /mnt/target/swapfile_mount
        - /mnt/target
      when: not ansible_check_mode

